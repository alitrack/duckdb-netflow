[package]
name = "netflow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Pure-compute NetFlow v5/v9 / IPFIX / sFlow v5 datagram decoder + well-formedness triage (ported verbatim from Query-farm vgi-netflow, no Arrow / no VGI deps)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"
